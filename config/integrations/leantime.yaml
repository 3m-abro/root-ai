# Non-secret Leantime contract metadata.
# Mirrors the live n8n workflow export:
# integrations/n8n/workflows/root-leantime-rpc.json
# API keys and webhook token values stay in n8n credentials.

version: 1

source_of_truth: projects
access: n8n_rpc
workflow: ROOT - Leantime RPC
workflow_file: integrations/n8n/workflows/root-leantime-rpc.json
webhook_path: /webhook/root/leantime/rpc
auth_header: x-root-api-key

credentials:
  read_write_separated: true
  source: n8n
  webhook: ROOT Webhook Header Auth
  read: Leantime Read Header Auth
  write: Leantime Write Header Auth

request:
  body_keys:
    - operation
    - params
    - requestId
  requestId:
    optional: true
    type: string
    max_length: 128

status:
  done_status: 0

forbidden_passthrough:
  - rpc_method
  - method
  - userId
  - status

allowlist_only: true
reject_arbitrary_rpc: true
ids:
  type: integer
  rule: Number.isSafeInteger && value > 0

ticket_fields:
  priority:
    type: integer
    min: 1
    max: 5
    mapping:
      1: Critical
      2: High
      3: Medium
      4: Low
      5: Lowest
  tags:
    type: string
    empty_clears: true
  dateToFinish:
    type: string
    format: YYYY-MM-DD
    empty_clears: true

operations:
  list_projects:
    approval_level: 0
    credential: read
    rpc_method: leantime.rpc.Projects.Projects.getAll
    params: {}

  get_project:
    approval_level: 0
    credential: read
    rpc_method: leantime.rpc.Projects.Projects.getProject
    params:
      required:
        - id

  list_tasks:
    approval_level: 0
    credential: read
    rpc_method: leantime.rpc.Tickets.Tickets.getAll
    params:
      required:
        - searchCriteria.projectId

  get_task:
    approval_level: 0
    credential: read
    rpc_method: leantime.rpc.Tickets.Tickets.getTicket
    params:
      required:
        - id

  create_task:
    approval_level: 1
    credential: write
    rpc_method: leantime.rpc.Tickets.Tickets.addTicket
    params:
      required:
        - projectId
        - headline
      optional:
        - description
        - priority
        - tags
        - dateToFinish

  update_task:
    approval_level: 1
    credential: write
    rpc_method: leantime.rpc.Tickets.Tickets.updateTicket
    params:
      required:
        - id
        - projectId
      one_of:
        - headline
        - description
        - priority
        - tags
        - dateToFinish
    preserve_description_if_omitted: true

  complete_task:
    approval_level: 1
    credential: write
    rpc_method: leantime.rpc.Tickets.Tickets.updateTicket
    params:
      required:
        - id
        - projectId
    forced:
      status: 0
    preserve_description: true
